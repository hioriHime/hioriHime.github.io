<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jardín Zen Interactivo</title>
  <link rel="stylesheet" href="stilo.css" />
</head>
<body>

  <!-- Elemento 1: Bonsai -->
  <div class="contenedor-info">
    <img src="bonsai.png" alt="Elemento del jardín" class="interactiva" onclick="mostrarInfo(this)" style="top: 80px; left: 120px;">
    <div class="info-box" style="top: 80px; left: 300px;">
      <img src="info.gif" alt="Información">
    </div>
  </div>

  <!-- Elemento 2: Zen -->
  <div class="contenedor-info">
    <img src="Zen.png" class="interactiva" onclick="mostrarInfo(this)" style="top: 300px; left: 410px;">
    <div class="info-box info-zen">
      <img src="info2.gif" alt="Información Zen">
    </div>
  </div>

  <!-- Elemento 3: Buda -->
  <div class="contenedor-info">
    <img src="buda.png" alt="Elemento 2" class="interactiva" onclick="mostrarInfo(this)" style="top: 88px; left: 700px;">
    <div class="info-box info-buda">
      <img src="info3.gif" alt="Info 2">
    </div>
  </div>

  <!-- Sonido -->
  <audio id="audioZen" src="Naturaleza.mp3" loop></audio>
  <button id="toggleSonido" onclick="activarSonido()" aria-label="Control de sonido">▶️</button>

  <!-- Scripts -->
  <script>
    function mostrarInfo(elemento) {
      const infoBox = elemento.nextElementSibling;

      if (infoBox.style.display === 'block') {
        infoBox.style.display = 'none';
      } else {
        document.querySelectorAll('.info-box').forEach(box => {
          box.style.display = 'none';
        });
        infoBox.style.display = 'block';
      }
    }

    function activarSonido() {
      const audio = document.getElementById('audioZen');
      const btnToggle = document.getElementById('toggleSonido');

      if (audio.paused) {
        audio.play();
        btnToggle.textContent = '⏸️';
      } else {
        audio.pause();
        btnToggle.textContent = '▶️';
      }
    }
  </script>

</body>
</html>
